manifestVersion: 1
id: me-blitzai
category: ai
name: BlitzAI
version: "1.0.0"
tagline: Hebrew-first transcription studio (Groq, Gemini, ivrit-ai)
description: >-
  Blitz AI is an open-source transcription tool with Hebrew-first support.
  Transcribe local audio/video files or paste a YouTube/Vimeo link and get
  full text. This build uses cloud transcription engines (Groq's ultra-fast
  Whisper, Google Gemini, and ivrit-ai for best Hebrew accuracy) to keep the
  image small — local on-device Whisper and speaker diarization are not
  included in this packaging.
developer: hoodini
website: https://github.com/hoodini/blitzai
dependencies: []
repo: https://github.com/hoodini/blitzai
support: https://github.com/hoodini/blitzai/issues
port: 5000
gallery: []
releaseNotes: >-
  Slim cloud-engines-only build for umbrelOS (~1GB image, no bundled
  faster-whisper/torch/pyannote GPU dependencies).
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: me
submission: https://github.com/hoodini/blitzai
