version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: blitzai_web_1
      APP_PORT: 3000

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: blitzai:latest
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "8000:8000"   # backend API (exposed so the browser-side frontend can reach it)
      - "3000:3000"   # frontend UI (Umbrel's app_proxy targets this)
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "3000"
      # Optional cloud engine keys — set via Umbrel's app settings if you use them
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      HUGGINGFACE_API_KEY: "${HUGGINGFACE_API_KEY:-}"
