manifestVersion: 1
id: me-invoices
category: finance
name: Invoices (Osek Za'ir)
version: "0.7.0"
tagline: Quotes, receipts and expenses for Israeli small businesses
icon: https://raw.githubusercontent.com/tcbr10/umbrel-images/master/me-invoices/icon.svg
description: >-
  Self-hosted management system for Israeli small businesses (Osek Za'ir / Osek Patur).


  Issue branded price quotes and receipts that carry the details Israeli
  bookkeeping rules require, log expenses, and follow income, expenses and
  profit on a dashboard. Several users can each run their own separate
  business account.


  All data stays on your Umbrel. To let clients open quotes and receipts from
  outside your home network, put the app behind a tunnel (for example
  Cloudflare Tunnel) and set the public URL in Settings.
releaseNotes: >-
  Server monitoring with Healthchecks.io: paste your ping key in Settings →
  ניטור השרת (shown to the server admin) and get alerts when the server, its
  internet connection, the PDF service, storage, recurring billing, reminders
  or the nightly backup stop working. Also /api/health?deep=1 for UptimeRobot.
  Backups are now written atomically.
